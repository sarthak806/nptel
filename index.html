<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Data Quiz</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1c2333;--mute:#667085;--line:#d5dbe6;--acc:#2f4bd8;--ok:#14803c;--okb:#e3f6ea;--no:#b42318;--nob:#fde8e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131b;--card:#192030;--ink:#eaeefb;--mute:#9aa4bd;--line:#2d3650;--acc:#7b93ff;--ok:#5fd68a;--okb:#143324;--no:#ff8f86;--nob:#3a1a1a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Georgia,"Times New Roman",serif;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mute);font-family:system-ui,sans-serif;font-size:.9rem;margin:0 0 16px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.stats{display:flex;justify-content:space-between;font:.85rem system-ui,sans-serif;color:var(--mute);margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.q{font-size:1.2rem;margin:0 0 16px;line-height:1.4}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:1rem;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--no);background:var(--nob)}
.msg{font:600 1rem system-ui,sans-serif;margin:14px 0 4px;min-height:1.5em}
.msg.ok{color:var(--ok)}.msg.no{color:var(--no)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{font:600 .95rem system-ui,sans-serif;border:2px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:10px 18px;cursor:pointer}
.btn.alt{background:transparent;color:var(--acc)}
.btn[hidden]{display:none}
.end{text-align:center}
.big{font-size:2.6rem;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>Big Data Quiz</h1>
<p class="sub">80 questions, shuffled each round. Pick an answer to check it.</p>
<div class="bar"><i id="pb"></i></div>
<div class="stats"><span id="pos"></span><span id="score"></span></div>
<div class="card" id="box"></div>
</div>
<script>
// Format per question: question|opt1|opt2|opt3|opt4|index of correct option (0-3)
const RAW=`A dataset was highly useful in 2024, but by 2026 the same dataset becomes irrelevant because the information has lost significance. Which "V" best describes this situation?|Validity|Veracity|Volatility|Venue|2
Which of the following statements about Oozie is CORRECT?|Oozie is a distributed NoSQL database.|Oozie is a workflow scheduler system for Hadoop jobs.|Oozie is used to store data in HDFS.|Oozie is a machine learning library for Spark.|1
Oozie can directly coordinate which of the following Hadoop ecosystem components?|Hive, Pig, Sqoop, and MapReduce|HDFS, NameNode, DataNode, and YARN only|Cassandra, MongoDB, and Redis only|Spark MLlib and GraphX only|0
What is the primary purpose of Apache Flume in the Hadoop ecosystem?|Querying data stored in HDFS|Collecting and transferring large amounts of log data|Performing machine learning tasks|Managing cluster resources|1
What is the primary role of Apache ZooKeeper in a Hadoop ecosystem?|Distributed data storage|Workflow scheduling|Distributed coordination and synchronization|SQL query processing|2
Hive primarily operates on data stored in:|MongoDB|Cassandra|HDFS|Redis|2
Which of the following best describes Apache Hive?|A distributed coordination service|A workflow scheduler|A data warehouse system built on Hadoop|A NoSQL database|2
Which Hadoop module stores metadata?|DataNode|TaskTracker|NameNode|Reducer|2
Which pair is correctly matched?|Hive – Stream Processing|Kafka – Distributed Commit Log|Sqoop – Graph Analytics|GraphX – ETL Tool|1
Which of the following is the PRIMARY function of Apache ZooKeeper in a distributed Hadoop environment?|Storing large-scale data across cluster nodes|Managing distributed coordination, synchronization, and configuration services|Executing SQL-like queries on HDFS data|Scheduling Hadoop workflows and jobs|1
Which HDFS component is primarily responsible for monitoring replica counts and initiating re-replication when a block becomes under-replicated?|DataNode|Client|NameNode|Secondary NameNode|2
What is the primary purpose of introducing the HDFS Federation?|Increase replication factor|Increase namespace scalability|Reduce block size|Eliminate DataNodes|1
Which of the following is directly affected by the number of HDFS blocks?|NameNode memory usage|Number of Map tasks|Both A and B|Neither A nor B|2
What is the default value of the parameter dfs.replication?|1|2|3|4|2
How does HDFS handle a DataNode failure that causes blocks to become under-replicated?|Ignores the failure|Deletes all blocks immediately|Marks the DataNode and initiates re-replication if needed|Restarts the DataNode automatically|2
Which statement about Reduce tasks is TRUE?|A key can be processed by multiple Reducers.|Each key is assigned to exactly one Reducer.|Reducers execute before Mappers.|Reducers never use partitioning.|1
What is the primary role of a Partitioner in MapReduce?|Sort records within a Reducer|Decide which Reducer receives a key-value pair|Combine Mapper outputs locally|Replicate data blocks across HDFS|1
Which YARN component is responsible for detecting task failures for a specific job?|Resource Manager (RM)|Node Manager (NM)|Application Master (AM)|DataNode|2
Which statement about the Reduce function is TRUE?|It accepts an intermediate key and a set of values.|It processes only one value at a time.|It cannot aggregate values.|It always produces multiple output values.|0
In the Reverse Web-Link Graph application, the Mapper emits:|(source, target)|(target, source)|(URL, 1)|(target, count)|1
Which statement best explains Spark's fault tolerance mechanism?|Every RDD is replicated across all nodes.|Every transformation result is written to HDFS.|Spark tracks lineage and recomputes lost partitions.|Spark checkpoints every operation by default.|2
Which operation below is an Action rather than a Transformation?|collect()|join()|map()|filter()|0
Which Spark component is responsible for splitting a DAG into stages?|SparkContext|TaskScheduler|DAGScheduler|BlockManager|2
Why is reduceByKey() generally preferred over groupByKey() for aggregation?|It automatically sorts keys.|It uses combiners on the map side.|It creates fewer partitions.|It avoids shuffling completely.|1
In Spark, which operation triggers actual execution of a DAG?|map()|filter()|join()|count()|3
Which statement about RDDs is FALSE?|RDDs are immutable.|RDDs can be cached for reuse.|RDDs automatically rebuild lost data using lineage.|RDDs support direct modification of existing partitions.|3
Which feature helps Spark recover lost RDD partitions?|Replication|Lineage|Compression|Scheduling|1
SparkContext is:|Storage system|Main entry point to Spark functionality|Worker node|Scheduler|1
Which Spark component launches tasks on worker nodes and retries failed tasks?|SparkContext|DAGScheduler|BlockManager|TaskScheduler|3
A Spark application performs multiple iterations over the same dataset. Which feature provides the greatest performance improvement?|HDFS replication|Data compression|Caching/Persistence of RDDs|Increasing block size|2
Which Cassandra replication strategy is specifically designed for multi-datacenter deployments?|Simple Strategy|Network Topology Strategy|Random Partitioner|Byte Ordered Partitioner|1
What is the primary purpose of Cassandra's Bloom Filter?|Store key-value pairs permanently|Compress SSTables|Quickly determine if a key may exist in an SSTable|Replace indexing structures|2
Which statement about Bloom Filters is TRUE?|They may produce false negatives.|They never produce false positives.|They may produce false positives but never false negatives|They guarantee exact membership testing.|2
In Cassandra, why are writes generally faster than reads?|Reads use only memory.|Writes avoid disk operations entirely.|Writes are append-oriented using Commit Logs and MemTables|Reads bypass SSTables.|2
Which Cassandra consistency level is the FASTEST for writes?|ALL|QUORUM|ONE|ANY|3
According to CAP theorem, Cassandra primarily chooses:|Consistency and Availability|Consistency and Partition Tolerance|Availability and Partition Tolerance|Atomicity and Durability|2
Which property defines Eventual Consistency?|All replicas are instantly synchronized.|Replicas converge if updates stop.|Reads always return latest value.|No stale reads are possible.|1
What happens if a ZooKeeper ensemble loses majority availability?|A new leader is elected immediately.|Remaining node becomes leader.|No leader can be elected.|System switches to standalone mode.|2
Which ZooKeeper design goal ensures that all updates are processed in a globally agreed order?|Ordered|Replicated|Fast|Atomic|0
What is the default type of znode in ZooKeeper?|Ephemeral|Sequential|Temporary|Persistent|3
What is the fundamental processing model used by Spark Streaming?|Record-at-a-time processing|Micro-batch processing|Batch-only processing|Pipeline processing|1
Which abstraction represents a stream of data in Spark Streaming?|DataFrame|RDD|DStream|Dataset|2
Which of the following is NOT a supported Spark Streaming input source?|Kafka|Flume|Twitter|HDFS Block Replicator|3
Why is maintaining two separate stacks for batch and streaming considered problematic?|Reduces throughput|Doubles implementation and operational effort|Prevents fault tolerance|Eliminates scalability|1
What is the main advantage of Spark Streaming's micro-batch architecture?|Eliminates RDDs|Supports only offline processing|Provides fault tolerance and scalability|Requires no cluster|2
Which Spark Streaming feature helps recover lost data after worker failure?|Replicated input data and RDD lineage|ZooKeeper election|Kafka partitions|SQL optimizer|0
Which function maintains arbitrary state across batches?|updateStateByKey()|reduceByKey()|union()|collect()|0
In Spark Streaming, every interval results in:|A new ZooKeeper node|An RDD graph computation|A new Kafka broker|A new DataNode|1
Which statement about Spark Streaming fault tolerance is TRUE?|Lost data cannot be recovered.|Transformations are exactly-once and fault-tolerant|Only input data is fault tolerant.|Failures require manual data recreation.|1
Which requirement is NOT listed for a stream-processing framework in Spark Streaming?|Second-scale latency|Efficient fault tolerance|Scalability|Fixed single-node execution|3
Cluster analysis is primarily a:|Supervised learning technique|Reinforcement learning technique|Unsupervised learning technique|Deep learning technique|2
What is the main goal of cluster analysis?|Predict future values|Organize similar items into groups|Classify labeled data|Reduce storage space|1
Which similarity measure calculates straight-line distance between two points?|Manhattan Distance|Cosine Similarity|Euclidean Distance|Hamming Distance|2
Which similarity measure is based on the angle between vectors?|Euclidean Distance|Manhattan Distance|Cosine Similarity|Jaccard Distance|2
Which is a common application of cluster analysis?|Customer segmentation|Sorting algorithms|Compiler optimization|CPU scheduling|0
Which algorithm is most commonly associated with cluster analysis?|Decision Tree|Naïve Bayes|K-Means|Logistic Regression|2
What is the first step of the K-Means algorithm?|Compute accuracy|Select initial centroids|Normalize output|Remove outliers|1
Which metric is commonly used to evaluate K-Means clustering quality?|Accuracy|Recall|WSSE|Precision|2
If WSSE decreases, it generally indicates:|Better cluster compactness|Worse clustering|More classification errors|Data loss|0
K-Means stops iterating when:|No changes occur in centroids|Accuracy becomes 100%|Dataset becomes empty|Number of features decreases|0
Random Forest is best described as:|A single deep decision tree|A clustering algorithm|A neural network ensemble|A bagging of de-correlated decision trees|3
What is the main purpose of Bagging?|Increase bias|Reduce prediction variance|Reduce dataset size|Increase overfitting|1
Bootstrap in Bagging refers to:|Sampling with replacement|Feature scaling|Gradient computation|Data normalization|0
In Random Forest, at each split:|All features are always evaluated|Random subset of features is selected|Features are ignored|Only one feature exists|1
Random Forest can naturally support parallel processing because:|Trees are built independently|Trees share memory|Trees use one processor|Trees require sequential execution|0
Boosting combines:|Strong classifiers only|Weak classifiers into a strong ensemble|Clusters into datasets|Databases into warehouses|1
Gradient Boosting builds models:|In a single step|Iteratively|Randomly|Without training|1
In Gradient Boosted Trees, the base learners are usually:|Decision Trees|Neural Networks|K-Means Clusters|Support Vectors|0
Cross-validation is mainly used to:|Increase dataset size|Assess model quality and select best parameters|Reduce number of features|Perform clustering|1
Recommended learning rate for Gradient Boosting is:|Greater than 1|Equal to 5|Less than or equal to 0.1|Equal to 10|2
What is the main goal of GraphX?|Database management|Unify data-parallel and graph-parallel analytics|Replace Spark SQL|Replace HDFS|1
Which phase is NOT part of the Graph-Parallel Pattern?|Gather|Apply|Scatter|Shuffle Sort|3
Which GraphX operator joins vertices and edges together?|mapV()|subgraph()|triplets|reverse()|2
In GraphX, a Property Graph consists of:|Only vertices|Only edges|Vertices and edges with properties|Tables only|2
Which graph algorithm is commonly used to identify influential vertices?|K-Means|PageRank|Apriori|Frequent Pattern Growth|1
Triangle Counting is mainly used for:|Sorting vertices|Community detection|Data compression|Replication|1
Which optimization reduces communication by avoiding unnecessary joins?|Join Elimination|Data Duplication|Replication Factor|Hash Partitioning|0
Which GraphX feature helps accelerate joins and construct subgraphs efficiently?|Bloom Filters|Indexing and Bitmaps|Commit Logs|MemTables|1
Which statement best describes GraphX?|Graph-only processing framework|Batch-only processing framework|Unified analytics framework for graph and data processing|SQL replacement system|2
Which GraphX optimization reuses routing tables, edge adjacency information, and indices across graphs and subgraphs?|Substantial Index and Data Reuse|Active Edge Indexing|Join Elimination|Pregel Messaging|0`;
const ALL=RAW.split("\n").map(l=>{const p=l.split("|");return{q:p[0],o:p.slice(1,5),a:+p[5]}});
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let deck,i,right,first;
function start(){deck=shuffle(ALL);i=0;right=0;show()}
function show(){
  if(i>=deck.length)return finish();
  const d=deck[i];first=true;
  $("pb").style.width=(i/deck.length*100)+"%";
  $("pos").textContent="Question "+(i+1)+" of "+deck.length;
  $("score").textContent="First-try correct: "+right;
  const box=$("box");box.innerHTML="";
  const q=document.createElement("p");q.className="q";q.textContent=d.q;box.appendChild(q);
  const btns=shuffle(d.o.map((t,k)=>({t,k}))).map(x=>{
    const b=document.createElement("button");b.className="opt";b.textContent=x.t;
    b.onclick=()=>pick(b,x.k);box.appendChild(b);return b});
  const m=document.createElement("div");m.className="msg";m.id="msg";m.setAttribute("aria-live","polite");box.appendChild(m);
  const r=document.createElement("div");r.className="row";
  r.innerHTML='<button class="btn" id="nx" hidden></button><button class="btn alt" id="rt" hidden>Try this question again</button>';
  box.appendChild(r);
  box._btns=btns;
}
function pick(b,k){
  const d=deck[i],box=$("box"),ok=k===d.a;
  box._btns.forEach(x=>x.disabled=true);
  b.classList.add(ok?"ok":"no");
  if(!ok)box._btns.find(x=>x.textContent===d.o[d.a]).classList.add("ok");
  const m=$("msg");m.className="msg "+(ok?"ok":"no");
  m.textContent=ok?"Correct!":"Not quite. The right answer is highlighted in green.";
  if(ok&&first)right++;
  first=false;
  $("score").textContent="First-try correct: "+right;
  const nx=$("nx");nx.hidden=false;nx.textContent=i+1<deck.length?"Next question":"See results";
  nx.onclick=()=>{i++;show()};nx.focus();
  const rt=$("rt");rt.hidden=false;
  rt.onclick=()=>{box._btns.forEach(x=>{x.disabled=false;x.className="opt"});m.textContent="";m.className="msg";nx.hidden=true;rt.hidden=true};
}
function finish(){
  $("pb").style.width="100%";
  $("pos").textContent="Finished";
  const n=deck.length,pc=Math.round(right/n*100);
  $("box").innerHTML='<div class="end"><div class="big">'+right+' / '+n+'</div><p>You got '+pc+'% right on the first try.</p><button class="btn" id="again">Start a new shuffled round</button></div>';
  $("again").onclick=start;
}
start();
</script>
</body>
</html>
